<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMaaS - Inventory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header will be inserted here by JavaScript -->
    
    <div class="container">
        <div class="dashboard-container">
            <div style="margin-bottom: 20px;">
                <a href="/dashboard.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.95em;">← Back to Dashboard</a>
            </div>
            
            <h1 class="inventory-title">📦 Inventory Management</h1>

            <!-- Filter Section -->
            <div class="filter-section">
                <h3 style="margin-bottom: 15px;">Filter by Category:</h3>
                <div class="filter-group" id="filterGroup">
                    <!-- Filter buttons will be generated by JavaScript -->
                </div>
            </div>

            <!-- Items Grid -->
            <div class="items-grid" id="itemsGrid">
                <!-- Items will be loaded here by JavaScript -->
            </div>

            <!-- No items message -->
            <div id="noItemsMessage" style="text-align: center; padding: 60px 20px; color: #7f8c8d;">
                <p style="font-size: 1.2em;">No items found in this category.</p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
