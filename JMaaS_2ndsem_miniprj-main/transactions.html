<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMaaS - Transaction History</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header will be added by JavaScript -->
    <div id="headerPlaceholder"></div>

    <div class="container" style="margin-top: 80px;">
        <div style="margin-bottom: 20px;">
            <a href="/dashboard.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.95em;">← Back to Dashboard</a>
        </div>

        <!-- Page Title -->
        <div style="margin-bottom: 30px;">
            <h1 style="color: var(--primary-color); margin-bottom: 10px;">📊 Transaction History</h1>
            <p style="color: var(--text-light);">View all past sales and transactions</p>
        </div>

        <!-- Summary Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card" style="background: linear-gradient(135deg, #d4af37 0%, #b8960f 100%); color: white;">
                <div style="font-size: 0.9em; opacity: 0.9;">Total Sales</div>
                <div style="font-size: 2em; font-weight: bold; margin: 10px 0;">₹<span id="totalSales">0</span></div>
                <div style="font-size: 0.85em; opacity: 0.8;"><span id="totalTransactions">0</span> transactions</div>
            </div>

            <div class="card" style="background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%); color: white;">
                <div style="font-size: 0.9em; opacity: 0.9;">GST Collected</div>
                <div style="font-size: 2em; font-weight: bold; margin: 10px 0;">₹<span id="totalGST">0</span></div>
                <div style="font-size: 0.85em; opacity: 0.8;">@18% on sales</div>
            </div>

            <div class="card" style="background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: white;">
                <div style="font-size: 0.9em; opacity: 0.9;">Average Transaction</div>
                <div style="font-size: 2em; font-weight: bold; margin: 10px 0;">₹<span id="avgTransaction">0</span></div>
                <div style="font-size: 0.85em; opacity: 0.8;">per transaction</div>
            </div>
        </div>

        <!-- Filters -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
            <input type="date" id="filterDate" style="padding: 8px 12px; border: 1px solid #bdc3c7; border-radius: 5px;">
            <select id="filterStatus" style="padding: 8px 12px; border: 1px solid #bdc3c7; border-radius: 5px;">
                <option value="">All Status</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
            </select>
            <button onclick="exportTransactions()" class="btn" style="padding: 8px 20px;">📥 Export CSV</button>
        </div>

        <!-- Transactions Table -->
        <div class="card" style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead style="background-color: var(--light-bg);">
                    <tr style="border-bottom: 2px solid var(--primary-color);">
                        <th style="padding: 12px; text-align: left; font-weight: bold;">Date</th>
                        <th style="padding: 12px; text-align: left; font-weight: bold;">Transaction ID</th>
                        <th style="padding: 12px; text-align: left; font-weight: bold;">Items</th>
                        <th style="padding: 12px; text-align: right; font-weight: bold;">Subtotal</th>
                        <th style="padding: 12px; text-align: right; font-weight: bold;">GST</th>
                        <th style="padding: 12px; text-align: right; font-weight: bold;">Total</th>
                        <th style="padding: 12px; text-align: center; font-weight: bold;">Status</th>
                        <th style="padding: 12px; text-align: center; font-weight: bold;">Action</th>
                    </tr>
                </thead>
                <tbody id="transactionsBody">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div id="emptyState" style="text-align: center; padding: 40px; color: var(--text-light); display: none;">
            <div style="font-size: 3em; margin-bottom: 10px;">📋</div>
            <p style="font-size: 1.1em;">No transactions found</p>
        </div>
    </div>

    <!-- Transaction Details Modal -->
    <div id="transactionModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: var(--primary-color); margin: 0;">Transaction Details</h2>
                <button onclick="closeTransactionModal()" style="background: none; border: none; font-size: 1.5em; cursor: pointer;">✕</button>
            </div>

            <div id="transactionDetails">
                <!-- Populated by JavaScript -->
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="printTransaction()" class="btn" style="flex: 1;">🖨️ Print</button>
                <button onclick="closeTransactionModal()" class="btn" style="flex: 1; background-color: var(--text-light);">Close</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
