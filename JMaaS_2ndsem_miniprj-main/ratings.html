<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMaaS - Product Ratings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header will be added by JavaScript -->
    <div id="headerPlaceholder"></div>

    <div class="container" style="margin-top: 80px;">
        <div style="margin-bottom: 20px;">
            <a href="/dashboard.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.95em;">← Back to Dashboard</a>
        </div>

        <!-- Page Title -->
        <div style="margin-bottom: 30px;">
            <h1 style="color: var(--primary-color); margin-bottom: 10px;">⭐ Product Ratings & Reviews</h1>
            <p style="color: var(--text-light);">Customer feedback and product reviews</p>
        </div>

        <!-- Add Rating Section -->
        <div class="card" style="margin-bottom: 30px; background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(44, 62, 80, 0.05) 100%); border-left: 5px solid var(--primary-color);">
            <h2 style="color: var(--secondary-color); margin-bottom: 20px;">📝 Add Your Rating</h2>
            <form id="ratingForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; align-items: end;">
                <!-- Product Selection -->
                <div>
                    <label for="productSelect" style="display: block; margin-bottom: 5px; font-weight: 600;">Select Product</label>
                    <select id="productSelect" required style="width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px;">
                        <option value="">-- Choose a product --</option>
                    </select>
                </div>

                <!-- Rating -->
                <div>
                    <label for="rating" style="display: block; margin-bottom: 5px; font-weight: 600;">Rating (1-5)</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="rating" required style="flex: 1; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px;">
                            <option value="">Select stars</option>
                            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                            <option value="4">⭐⭐⭐⭐ Very Good</option>
                            <option value="3">⭐⭐⭐ Good</option>
                            <option value="2">⭐⭐ Fair</option>
                            <option value="1">⭐ Poor</option>
                        </select>
                    </div>
                </div>

                <!-- Comment -->
                <div style="grid-column: 1 / -1;">
                    <label for="comment" style="display: block; margin-bottom: 5px; font-weight: 600;">Your Review (Optional)</label>
                    <textarea id="comment" placeholder="Share your thoughts about this product..." 
                        style="width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; min-height: 80px;"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" style="grid-column: 1 / -1;">
                    ✅ Submit Rating
                </button>
            </form>
        </div>

        <!-- Ratings Summary -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card" style="background: linear-gradient(135deg, #d4af37 0%, #b8960f 100%); color: white; text-align: center;">
                <div style="font-size: 0.9em; opacity: 0.9;">Average Rating</div>
                <div style="font-size: 3em; font-weight: bold; margin: 10px 0;" id="avgRating">4.5</div>
                <div style="font-size: 0.9em;">Based on <span id="totalRatings">0</span> reviews</div>
            </div>

            <div class="card" style="background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%); color: white; text-align: center;">
                <div style="font-size: 0.9em; opacity: 0.9;">5-Star Ratings</div>
                <div style="font-size: 2.5em; font-weight: bold; margin: 10px 0;" id="fiveStarCount">0</div>
                <div style="font-size: 0.85em; opacity: 0.8;"><span id="fiveStarPercent">0</span>% of reviews</div>
            </div>

            <div class="card" style="background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: white; text-align: center;">
                <div style="font-size: 0.9em; opacity: 0.9;">Most Rated Product</div>
                <div style="font-size: 1.2em; font-weight: bold; margin: 10px 0;" id="topProduct">Loading...</div>
                <div style="font-size: 0.85em; opacity: 0.8;">🏆 Customer favorite</div>
            </div>
        </div>

        <!-- All Ratings -->
        <div class="card">
            <h2 style="color: var(--secondary-color); margin-bottom: 20px;">📊 All Reviews</h2>

            <!-- Filters -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <select id="filterRating" style="padding: 8px 12px; border: 1px solid #bdc3c7; border-radius: 5px;">
                    <option value="">All Ratings</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5 stars)</option>
                    <option value="4">⭐⭐⭐⭐ (4 stars)</option>
                    <option value="3">⭐⭐⭐ (3 stars)</option>
                    <option value="2">⭐⭐ (2 stars)</option>
                    <option value="1">⭐ (1 star)</option>
                </select>
                <select id="filterProduct" style="padding: 8px 12px; border: 1px solid #bdc3c7; border-radius: 5px;">
                    <option value="">All Products</option>
                </select>
            </div>

            <!-- Ratings List -->
            <div id="ratingsList">
                <!-- Populated by JavaScript -->
                <div style="text-align: center; padding: 40px; color: var(--text-light);">
                    <div style="font-size: 2em; margin-bottom: 10px;">⏳</div>
                    <p>Loading ratings...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/ratings.js"></script>
</body>
</html>
