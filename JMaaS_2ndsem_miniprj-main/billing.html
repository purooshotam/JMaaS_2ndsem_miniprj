<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMaaS - Billing</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header will be inserted here by JavaScript -->
    
    <div class="container">
        <div class="dashboard-container">
            <div style="margin-bottom: 20px;">
                <a href="/dashboard.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.95em;">← Back to Dashboard</a>
            </div>
            
            <h1 class="inventory-title">🧾 Billing Calculator</h1>

            <div class="billing-container">
                <!-- Items List -->
                <div class="items-list">
                    <h2>Items in Bill</h2>
                    <div id="billItemsContainer">
                        <!-- Items will be loaded here by JavaScript -->
                    </div>
                    <div id="emptyCart" class="empty-cart" style="display: none;">
                        <div class="empty-cart-icon">🛒</div>
                        <p>Your cart is empty</p>
                        <p style="font-size: 0.9em; color: #7f8c8d;">Add items from inventory to start billing</p>
                        <button class="btn btn-primary" style="margin-top: 15px;" onclick="navigateTo('inventory.html')">
                            Go to Inventory
                        </button>
                    </div>
                </div>

                <!-- Bill Summary -->
                <div class="billing-summary">
                    <h3>Bill Summary</h3>
                    
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    
                    <div class="summary-row gst">
                        <span>GST (18%):</span>
                        <span id="gstAmount">₹0</span>
                    </div>
                    
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="totalAmount">₹0</span>
                    </div>
                    
                    <button class="btn-print" onclick="printBill()">🖨️ Print Bill</button>
                    <button class="btn-print" style="background-color: #3498db; margin-top: 10px;" onclick="clearBill()">
                        🗑️ Clear Bill
                    </button>
                    <button class="btn-print" style="background-color: #27ae60; margin-top: 10px;" onclick="navigateTo('inventory.html')">
                        ➕ Add More Items
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/billing.js"></script>
</body>
</html>
