<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMaaS - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">💎 JMaaS</h1>
            <p class="login-subtitle">Jewellery Management as a Service</p>
            
            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none; margin-bottom: 20px;">
                <strong>Error:</strong> <span id="errorText"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <!-- Demo Credentials -->
            <div class="login-footer">
                <p><strong>🔓 Demo Credentials:</strong></p>
                <p>Username: <code>demo</code></p>
                <p>Password: <code>demo123</code></p>
            </div>

            <!-- Registration Link -->
            <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #bdc3c7;">
                <p style="margin: 0 0 10px 0; color: var(--text-light);">New to JMaaS?</p>
                <a href="signup.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 1.05em;">
                    Create Account →
                </a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Store username in localStorage
                    localStorage.setItem('username', username);
                    // Redirect to dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    displayLoginError(data.message || 'Login failed');
                }
            } catch (error) {
                displayLoginError('Error connecting to server. Make sure the server is running on http://localhost:3000');
                console.error('Login error:', error);
            }
        });

        function displayLoginError(message) {
            const errorMsg = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorMsg.style.display = 'block';
        }

        // Clear error on input
        document.getElementById('username').addEventListener('input', () => {
            document.getElementById('errorMessage').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('errorMessage').style.display = 'none';
        });
    </script>
</body>
</html>
